<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="《长安十二时辰》改编的浏览器单页剧情冒险游戏：十二时辰主线、剧情分支、多结局与 MBTI 人格画像。">
  <title>长安十二时辰 · 灯火如昼</title>
  <!-- 空 favicon：避免浏览器请求 /favicon.ico 拿到 404，污染控制台 -->
  <link rel="icon" href="data:,">
  <!-- 图标来自外部 CDN。离线或被网络策略拦掉时，给 <html> 挂上 no-icons，
       由 CSS 收掉所有图标占位元素——图标纯装饰，缺了不影响任何功能与阅读。 -->
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"
          onerror="document.documentElement.classList.add('no-icons')"></script>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <!-- 顶栏：时辰刻度 -->
    <header id="topBar">
      <div class="brand">
        <iconify-icon icon="game-icons:lantern-flame" aria-hidden="true"></iconify-icon>
        <span class="brand-title">长安十二时辰</span>
        <span class="brand-sub">灯火如昼 · 元月十四</span>
      </div>

      <div class="top-actions">
        <button class="nav-link" id="panelToggle" type="button" aria-controls="sidePanel" aria-expanded="false">
          <iconify-icon icon="game-icons:hourglass" aria-hidden="true"></iconify-icon>
          <span>状态</span>
        </button>
        <a href="./results.html" class="nav-link" title="全结局与图鉴">
          <iconify-icon icon="game-icons:scroll-unfurled" aria-hidden="true"></iconify-icon>
          <span>结局图鉴</span>
        </a>
        <a href="./extensions/map.html" class="nav-link" title="长安城舆图 · 场景导航">
          <iconify-icon icon="game-icons:map" aria-hidden="true"></iconify-icon>
          <span>长安舆图</span>
        </a>
        <a href="./extensions/hub.html" class="nav-link" title="项目总控台">
          <iconify-icon icon="game-icons:forge" aria-hidden="true"></iconify-icon>
          <span>总控台</span>
        </a>
        <button class="nav-link" id="restartBtn" type="button" title="清空进度，从死牢重新开始">
          <iconify-icon icon="game-icons:reload" aria-hidden="true"></iconify-icon>
          <span>重新开局</span>
        </button>
      </div>

      <div id="clockStrip" aria-label="十二时辰进度"></div>
    </header>

    <!-- 中央剧情舞台 -->
    <main id="scene" class="scene" aria-label="剧情正文与抉择"></main>

    <!-- 侧栏 -->
    <aside id="sidePanel">
      <!-- 当前视角 -->
      <section class="panel-section">
        <div class="panel-title"><iconify-icon icon="game-icons:person" aria-hidden="true"></iconify-icon> 当前视角</div>
        <div id="view" class="view-box"></div>
      </section>

      <!-- 时辰 / 状态 -->
      <section class="panel-section">
        <div class="panel-title"><iconify-icon icon="game-icons:hourglass" aria-hidden="true"></iconify-icon> 进度</div>
        <div class="stat-row"><span>当前时辰</span><span id="momentLabel">子时 · 夜半</span></div>
        <div class="stat-row"><span>已过时辰</span><span id="hourCount">0 / 12</span></div>
        <div class="stat-row"><span>关键抉择</span><span id="choiceCount">0</span></div>
        <div id="resumeNote" class="resume-note hidden"></div>
      </section>

      <!-- 线索袋 -->
      <section class="panel-section">
        <div class="panel-title"><iconify-icon icon="game-icons:scroll-unfurled" aria-hidden="true"></iconify-icon> 线索袋</div>
        <div id="clueList" class="list"></div>
      </section>

      <!-- 侦探笔记 -->
      <section class="panel-section">
        <div class="panel-title"><iconify-icon icon="game-icons:spyglass" aria-hidden="true"></iconify-icon> 侦探笔记</div>
        <div id="puzzleList" class="list"></div>
      </section>

      <!-- 长安小识（历史知识卡片） -->
      <section class="panel-section">
        <div class="panel-title"><iconify-icon icon="game-icons:open-book" aria-hidden="true"></iconify-icon> 长安小识</div>
        <div id="knowledgeSideList" class="list">
          <div class="empty-hint">游历长安，解锁知识。</div>
        </div>
      </section>

      <!-- 队伍 / 关系 -->
      <section class="panel-section">
        <div class="panel-title"><iconify-icon icon="game-icons:grouped-drops" aria-hidden="true"></iconify-icon> 同路人</div>
        <div id="partyList" class="list"></div>
      </section>

      <!-- 大事记 -->
      <section class="panel-section">
        <div class="panel-title"><iconify-icon icon="game-icons:scroll-quill" aria-hidden="true"></iconify-icon> 大事记</div>
        <div id="chronicleList" class="list"></div>
      </section>

      <div class="panel-foot">键盘 1 / 2 / 3 可直接选择选项</div>
    </aside>
  </div>

  <!-- 推理突破通知 -->
  <div id="puzzleToast" class="puzzle-toast hidden" role="alert" aria-live="polite"></div>

  <!-- 历史知识卡片弹窗 -->
  <div id="knowledgeModal" class="knowledge-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="knowledgeModalTitle" aria-hidden="true">
    <div class="knowledge-overlay-bg"></div>
    <div class="knowledge-overlay-content">
      <button class="knowledge-close" id="knowledgeModalClose" type="button" aria-label="关闭">✕</button>
      <div id="knowledgeModalBody"></div>
    </div>
  </div>

  <!-- 结局 / 重置浮层 -->
  <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"
       aria-labelledby="overlayTitle" aria-hidden="true">
    <div class="overlay-modal">
      <h2 id="overlayTitle"></h2>
      <div id="overlayBody"></div>
      <button class="btn primary block" id="overlayAction" type="button"></button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
