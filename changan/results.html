<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>长安十二时辰 · 全结局与图鉴</title>
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <style>
    :root {
      --bg: #14100e;
      --bg2: #1d1712;
      --panel: #221b15;
      --panel2: #2b2219;
      --line: #4a3a28;
      --text: #e8dcc8;
      --muted: #9a8a72;
      --accent: #d4a24c;
      --accent2: #b8452f;
      --danger: #c0392b;
      --ok: #6b8e5a;
      --gold: #e0b657;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
      font-size: 15px;
      line-height: 1.75;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }

    /* Header */
    .hero {
      text-align: center;
      border-bottom: 1px solid var(--line);
      padding-bottom: 32px;
      margin-bottom: 44px;
    }
    .hero iconify-icon { font-size: 40px; color: var(--accent); }
    .hero h1 { font-size: 30px; color: var(--gold); letter-spacing: 4px; margin-top: 8px; }
    .hero p { color: var(--muted); font-size: 13px; margin-top: 6px; letter-spacing: 2px; }
    .hero .nav-links { margin-top: 16px; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .hero .nav-links a {
      color: var(--accent);
      text-decoration: none;
      border: 1px solid var(--line);
      padding: 6px 16px;
      border-radius: 3px;
      font-size: 13px;
      transition: all .16s;
    }
    .hero .nav-links a:hover { background: var(--panel2); border-color: var(--accent); }
    .share-btn {
      display: inline-block;
      background: var(--panel); color: var(--gold);
      border: 1px solid var(--gold); padding: 6px 16px;
      border-radius: 3px; cursor: pointer; font-family: inherit;
      font-size: 13px; text-decoration: none; transition: all .16s;
    }
    .share-btn:hover { background: rgba(212,162,76,.12); border-color: var(--gold); }

    /* Section title */
    .section-title {
      font-size: 18px;
      color: var(--gold);
      letter-spacing: 3px;
      border-left: 3px solid var(--accent);
      padding-left: 14px;
      margin-bottom: 22px;
      margin-top: 44px;
    }
    .section-title small {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
      font-weight: normal;
    }

    /* ===== 结局 ===== */
    .endings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
    .ending-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 24px 20px;
      transition: all .2s;
    }
    .ending-card:hover { border-color: var(--accent); }
    .ending-card .tag {
      display: inline-block;
      font-size: 11px;
      padding: 2px 10px;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 2px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .ending-card h3 { color: var(--gold); font-size: 17px; margin-bottom: 10px; }
    .ending-card p { font-size: 13px; color: var(--text); line-height: 1.85; }
    .ending-card p + p { margin-top: 8px; }
    .ending-card .vary {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted, #8a8578);
      line-height: 1.7;
    }
    .ending-card .tagline {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--line);
      font-style: italic;
      color: var(--accent);
      font-size: 13px;
      text-align: center;
    }

    /* 达成条件（从 h_hai 的选项与门控条件派生，不手写） */
    .ending-card .how {
      margin-top: 12px;
      padding: 10px 12px;
      background: rgba(0, 0, 0, .18);
      border: 1px dashed var(--line);
      border-radius: 3px;
    }
    .ending-card .how-title {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .ending-card .how-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 12px;
      line-height: 1.6;
      padding: 4px 0;
    }
    .ending-card .how-row + .how-row { border-top: 1px dotted var(--line); }
    .ending-card .how-opt { color: var(--text); }
    .ending-card .how-gate { color: var(--gold); font-size: 11px; }

    /* ===== MBTI 网格 ===== */
    .mbti-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }

    .mbti-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 18px 16px;
      transition: all .2s;
      cursor: default;
      position: relative;
    }
    .mbti-card:hover { border-color: var(--accent); transform: translateY(-2px); }

    .mbti-card .mbti-code {
      font-size: 24px;
      font-weight: bold;
      color: var(--gold);
      letter-spacing: 3px;
      line-height: 1.2;
      text-shadow: 0 0 12px rgba(224, 182, 87, .2);
    }
    .mbti-card .mbti-name {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 1px;
      margin-top: 2px;
    }
    .mbti-card .mbti-title {
      font-size: 13px;
      color: var(--accent);
      font-style: italic;
      margin-top: 4px;
    }
    .mbti-card .mbti-desc {
      font-size: 12px;
      color: var(--text);
      line-height: 1.75;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--line);
    }

    .mbti-card .char {
      margin-top: 12px;
      padding: 10px 12px;
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 3px;
      text-align: center;
    }
    .mbti-card .char-name {
      font-size: 15px;
      color: var(--gold);
      font-weight: bold;
    }
    .mbti-card .char-alias {
      font-size: 11px;
      color: var(--accent);
      margin-top: 1px;
    }
    .mbti-card .char-side {
      display: inline-block;
      font-size: 10px;
      padding: 1px 8px;
      border: 1px solid var(--line);
      border-radius: 2px;
      color: var(--muted);
      margin-top: 4px;
    }
    .mbti-card .char-bio {
      font-size: 12px;
      color: var(--text);
      line-height: 1.7;
      margin-top: 8px;
      text-align: left;
    }
    .mbti-card .char-words {
      font-size: 12px;
      color: var(--gold);
      font-style: italic;
      margin-top: 6px;
    }

    /* Dimensional badges */
    .dim-badges {
      display: flex;
      gap: 4px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .dim-badge {
      font-size: 10px;
      padding: 1px 7px;
      border-radius: 2px;
      border: 1px solid var(--line);
    }
    .dim-badge.E { color: #d48c4c; border-color: #d48c4c; }
    .dim-badge.I { color: #6b9e8a; border-color: #6b9e8a; }
    .dim-badge.S { color: #d4a24c; border-color: #d4a24c; }
    .dim-badge.N { color: #9a72c0; border-color: #9a72c0; }
    .dim-badge.T { color: #c0392b; border-color: #c0392b; }
    .dim-badge.F { color: #e8886a; border-color: #e8886a; }
    .dim-badge.J { color: #5a8e8a; border-color: #5a8e8a; }
    .dim-badge.P { color: #b8a060; border-color: #b8a060; }

    /* ===== 人物一览 ===== */
    .char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .char-card-full {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 20px;
      transition: all .2s;
    }
    .char-card-full:hover { border-color: var(--accent); }
    .char-card-full .head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .char-card-full .head .name { font-size: 18px; color: var(--gold); font-weight: bold; }
    .char-card-full .head .alias { font-size: 11px; color: var(--accent); }
    .char-card-full .head .side {
      font-size: 10px;
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 2px;
      color: var(--muted);
    }
    .char-card-full .bio {
      font-size: 13px;
      line-height: 1.8;
      color: var(--text);
      margin-top: 8px;
    }
    .char-card-full .words {
      font-size: 13px;
      color: var(--gold);
      font-style: italic;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--line);
    }
    .char-card-full .mbti-tag {
      display: inline-block;
      font-size: 11px;
      padding: 1px 8px;
      background: var(--panel2);
      border: 1px solid var(--accent);
      border-radius: 2px;
      color: var(--accent);
      letter-spacing: 1px;
      margin-top: 8px;
    }

    /* TOC */
    .toc {
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 18px 22px;
      margin-bottom: 32px;
    }
    .toc-title {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .toc a {
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      display: inline-block;
      margin-right: 18px;
      margin-bottom: 6px;
    }
    .toc a:hover { text-decoration: underline; }

    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 4px 14px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      font-family: inherit;
      font-size: 12px;
      border-radius: 2px;
      cursor: pointer;
      transition: all .16s;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn.active { background: var(--accent); color: #1a1208; border-color: var(--gold); font-weight: bold; }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-style: italic;
    }

    footer {
      text-align: center;
      padding: 32px 0 16px;
      border-top: 1px solid var(--line);
      margin-top: 48px;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
<div class="container">

  <!-- Hero -->
  <div class="hero">
    <iconify-icon icon="game-icons:lantern-flame"></iconify-icon>
    <h1>长安十二时辰 · 全结局与图鉴</h1>
    <p>十六型人格 · 三位归宿 · 满城人物</p>
    <div class="nav-links">
      <a href="./">← 返回游戏</a>
      <a href="#endings">结局一览</a>
      <a href="#mbti">MBTI 图鉴</a>
      <a href="#characters">人物名册</a>
      <a href="./extensions/share-card.html" class="share-btn">📤 分享卡片</a>
      <a href="./extensions/hub.html">🏠 总控台</a>
    </div>
  </div>

  <!-- TOC -->
  <div class="toc">
    <div class="toc-title">📜 本章目次</div>
    <a href="#endings">壹 · 全部结局</a>
    <a href="#mbti">贰 · 十六型人格与人物</a>
    <a href="#characters">叁 · 长安人物名册</a>
  </div>

  <!-- ============ 结局 ============ -->
  <!-- 标题里的结局数量由脚本按 scenes.js 实际内容填充，不写死 -->
  <div class="section-title" id="endings">壹 · 全部结局 <small>— 你的选择决定长安的命运</small></div>
  <div class="endings-grid" id="endingsGrid"></div>

  <!-- ============ MBTI ============ -->
  <div class="section-title" id="mbti">贰 · 十六型人格与人物 <small>— 每一种人格，对应一个长安角色</small></div>
  <div class="filter-bar" id="mbtiFilter">
    <button class="filter-btn active" data-filter="all">全部 (16)</button>
    <button class="filter-btn" data-filter="NT">NT 理性者</button>
    <button class="filter-btn" data-filter="NF">NF 理想主义者</button>
    <button class="filter-btn" data-filter="SJ">SJ 守护者</button>
    <button class="filter-btn" data-filter="SP">SP 技艺者</button>
  </div>
  <div class="mbti-grid" id="mbtiGrid"></div>

  <!-- ============ 人物 ============ -->
  <div class="section-title" id="characters">叁 · 长安人物名册 <small>— 谁在守护这座城</small></div>
  <div class="char-grid" id="charGrid"></div>

  <footer>
    <iconify-icon icon="game-icons:lantern-flame"></iconify-icon>
    <span style="margin-left:6px">长安十二时辰 · 灯火如昼 · MBTI 互动游戏</span>
  </footer>
</div>

<script type="module">
import { characters } from './src/data/characters.js';
import { MBTI_TYPES, CHARACTER_MBTI } from './src/data/mbti.js';
import { scenes } from './src/data/scenes.js';
import { resolveText, conditionalInsertCount } from './src/text.js';

// 少量剧情 flag 的中文说明（没列到的就不显示文案，避免乱猜）
//
// ⚠️ 这两个必须声明在**顶层 `const endings = ...` 之前**。
//    describeCond 是函数声明（会提升），但它在 endings 求值时被同步调用；
//    而 const 不提升 —— 声明写在 endings 后面就会命中 TDZ，
//    整页抛「Cannot access 'flagLabel' before initialization」，结局图鉴直接白屏。
//    （曾经就是这个问题：页面结构完整、CSS 正常，就是渲染不出任何卡片。）
const FLAG_LABELS = { chase_court: '查朝堂' };
const flagLabel = (f) => FLAG_LABELS[f] || f;

// 把条件表达式翻译成给玩家看的人话
function describeCond(cond) {
  if (!cond) return '';
  const parts = [];
  if (typeof cond.allies === 'number') parts.push(`至少 ${cond.allies} 位同路人信任你`);
  if (cond.flagsAll) parts.push(`需要${cond.flagsAll.map(f => '「' + flagLabel(f) + '」').join('、')}`);
  if (cond.flagsAny) parts.push(`需要${cond.flagsAny.map(f => '「' + flagLabel(f) + '」').join(' 或 ')}`);
  if (cond.trust) {
    const t = Object.entries(cond.trust).map(([who, v]) => {
      const name = (characters[who] && characters[who].name) || who;
      return `${name}的信任 ≥ ${v}`;
    });
    parts.push(`需要${t.join('、')}`);
  }
  if (typeof cond.clues === 'number') parts.push(`至少 ${cond.clues} 条线索`);
  return parts.join('，');
}

// 静态档案页没有玩家 state，需要一个"展示用"的条件判定：
//   · flagsAll / flagsAny / 数值条件（allies/trust/clues）→ 全部判真，展示"把人/条件都凑齐"的完整版；
//   · flagsNone → 只有当该 flag 不在本节点其它插段"出现为正向"时才成立，
//     以此正确处理 e_final_persuade 里 `flagsAll:['final_empathy']` 与
//     `flagsNone:['final_empathy']` 这种**互斥**插段——二者不能同时判真，
//     否则会把劝降的两版开场错误地拼成同一段。
function staticEvalCond(cond, sc) {
  if (!cond) return true;
  if (cond.flagsNone) {
    const positiveFlags = new Set();
    for (const it of (sc.inserts || [])) {
      if (!it.when) continue;
      if (it.when.flagsAll) it.when.flagsAll.forEach(f => positiveFlags.add(f));
      if (it.when.flagsAny) it.when.flagsAny.forEach(f => positiveFlags.add(f));
    }
    return cond.flagsNone.every(f => !positiveFlags.has(f));
  }
  return true;
}

// ===== 结局数据：全部从 scenes.js 派生 =====
// 早期版本在这里手抄了一份结局文案，结果抄出了「你可活了下了」这类错字且长期没人发现。
// 现在文案、标题、结语都只有一个来源，改 scenes.js 这个页面自动跟着变。
//
// ⚠️ 正文必须走 resolveText（src/text.js），不能直接取 sc.text：
//    结局节点里也有 {{inserts}} 标记，直接读会把标记原样吐出来。
//    本页是静态档案、没有玩家 state，所以传 `staticEvalCond`（见上方定义）：
//    正向条件（flagsAll/flagsAny/数值）全部判真，展示"把人/条件都凑齐"的完整版；
//    但 `flagsNone` 会与同节点的 `flagsAll` 互斥——劝降结局的两种开场不会同时出现。
//    到底实际会出现哪几段，由下方 varyNote 说明。
const endings = Object.entries(scenes)
  .filter(([, sc]) => sc.ending)
  .map(([id, sc]) => ({
    id,
    tag: sc.endTag,
    title: sc.endTag.replace(/^结局\s*·\s*/, ''),
    tagline: sc.endingText || '',
    text: resolveText(sc, c => staticEvalCond(c, sc)),
    varyNote: conditionalInsertCount(sc),
    routes: routesTo(id),
  }));

// 从 h_hai 的选项反推「怎么才能走到这个结局」——门控信息同样只有一个来源
function routesTo(endId) {
  const list = [];
  ((scenes.h_hai && scenes.h_hai.choices) || []).forEach(ch => {
    const isRouter = Array.isArray(ch.to);
    if (isRouter) {
      // 条件路由：同一选项可能有多条分支通往不同结局，逐条列出，避免漏掉"毁油罐也能成功"这类旁路
      ch.to.forEach(r => {
        if (!r || r.then !== endId) return;
        const fallback = !r.when; // 没有 when 的兜底分支：前述条件都不满足时才走到
        const gate = fallback
          ? '（前述「拔刀」条件都不满足时的兜底：同路人不足 3 且未毁油罐）'
          : describeCond(r.when);
        list.push({ option: ch.t, gate });
      });
    } else {
      if (ch.to !== endId) return;
      list.push({ option: ch.t, gate: describeCond(ch.require || null) });
    }
  });
  return list;
}

// ===== 维度分组 =====
function temperament(type) {
  const [, s, t, j] = type;
  if (s === 'N' && t === 'T') return 'NT';
  if (s === 'N' && t === 'F') return 'NF';
  if (s === 'S' && j === 'J') return 'SJ';
  if (s === 'S' && j === 'P') return 'SP';
  return 'other';
}

function dimLabel(letter) {
  const map = { E:'外向', I:'内向', S:'实感', N:'直觉', T:'思考', F:'情感', J:'判断', P:'知觉' };
  return map[letter] || letter;
}

// ===== 渲染结局 =====
document.getElementById('endings').innerHTML =
  `壹 · 全部结局（${endings.length} 种） <small>— 你的选择决定长安的命运</small>`;

const endingsGrid = document.getElementById('endingsGrid');
endings.forEach(e => {
  const card = document.createElement('div');
  card.className = 'ending-card';
  card.innerHTML = `
    <div class="tag">${e.tag}</div>
    <h3>${e.title}</h3>
    ${e.text.split('\n\n').filter(p => p.trim()).map(p => `<p>${p}</p>`).join('')}
    ${e.varyNote ? `<div class="vary">本结局正文含 ${e.varyNote} 段随选择变化的段落 —— 上方按一种完整路线展示，实际游戏里只会出现你真正触发的那一版。</div>` : ''}
    <div class="tagline">${e.tagline}</div>
    ${e.routes.length ? `<div class="how"><div class="how-title">如何抵达</div>${e.routes.map(r => `
      <div class="how-row">
        <span class="how-opt">${r.option}</span>
        ${r.gate ? `<span class="how-gate">${r.gate}</span>` : ''}
      </div>`).join('')}</div>` : ''}
  `;
  endingsGrid.appendChild(card);
});

// ===== 渲染 MBTI =====
const mbtiGrid = document.getElementById('mbtiGrid');
const filterBtns = document.querySelectorAll('[data-filter]');

function renderMBTI(filter = 'all') {
  mbtiGrid.innerHTML = '';
  const entries = Object.entries(MBTI_TYPES);
  const filtered = filter === 'all' ? entries : entries.filter(([type]) => temperament(type) === filter);

  if (filtered.length === 0) {
    mbtiGrid.innerHTML = '<div class="empty-state">该气质类型下暂无角色。</div>';
    return;
  }

  filtered.forEach(([type, info]) => {
    const char = characters[info.who];
    if (!char) return;
    const vec = CHARACTER_MBTI[info.who] || {};
    const dims = Object.entries(vec)
      .filter(([, v]) => v !== 0)
      .sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]))
      .slice(0, 3)
      .map(([k, v]) => {
        const letter = v > 0 ? k[0] : k[1];
        const cls = letter;
        return `<span class="dim-badge ${cls}">${letter} ${dimLabel(letter)}</span>`;
      }).join('');

    const card = document.createElement('div');
    card.className = 'mbti-card';
    card.dataset.temp = temperament(type);
    card.innerHTML = `
      <div class="mbti-code">${type}</div>
      <div class="mbti-name">${info.name}</div>
      <div class="mbti-title">${info.title}</div>
      <div class="dim-badges">${dims}</div>
      <div class="mbti-desc">${info.desc}</div>
      <div class="char">
        <div class="char-name">${char.name}</div>
        <div class="char-alias">${char.alias}</div>
        <div class="char-side">${char.side}</div>
        <div class="char-bio">${char.bio}</div>
        <div class="char-words">「${char.words}」</div>
      </div>
    `;
    mbtiGrid.appendChild(card);
  });
}

filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderMBTI(btn.dataset.filter);
  });
});

// 过滤器上的数字按实际数据填充，避免写死后与 MBTI_TYPES 脱节
const allFilterBtn = document.querySelector('[data-filter="all"]');
if (allFilterBtn) allFilterBtn.textContent = `全部 (${Object.keys(MBTI_TYPES).length})`;

renderMBTI();

// ===== 渲染人物 =====
const charGrid = document.getElementById('charGrid');

// Build char-to-MBTI map
const charToMBTI = {};
for (const [type, info] of Object.entries(MBTI_TYPES)) {
  charToMBTI[info.who] = type;
}

Object.entries(characters)
  .sort((a, b) => {
    // POV first
    const aPov = a[1].isPOV ? 0 : 1;
    const bPov = b[1].isPOV ? 0 : 1;
    return aPov - bPov;
  })
  .forEach(([id, char]) => {
    const mbti = charToMBTI[id];
    const card = document.createElement('div');
    card.className = 'char-card-full';
    card.innerHTML = `
      <div class="head">
        <div>
          <div class="name">${char.name}</div>
          <div class="alias">${char.alias}</div>
        </div>
        <div class="side">${char.side}</div>
      </div>
      ${mbti ? `<div class="mbti-tag">${mbti} · ${MBTI_TYPES[mbti]?.name || ''}</div>` : ''}
      <div class="bio">${char.bio}</div>
      <div class="words">「${char.words}」</div>
    `;
    charGrid.appendChild(card);
  });

</script>
</body>
</html>
