<style>
:root {
  --bg: #14100e; --bg2: #1d1712; --panel: #221b15;
  --line: #4a3a28; --text: #e8dcc8; --muted: #9a8a72;
  --accent: #d4a24c; --gold: #e0b657;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  font-size: 14px; padding: 30px 20px 60px;
}
.container { max-width: 1100px; margin: 0 auto; }

header {
  text-align: center; border-bottom: 1px solid var(--line);
  padding-bottom: 24px; margin-bottom: 32px;
}
header h1 { font-size: 26px; color: var(--gold); letter-spacing: 4px; }
header p { color: var(--muted); font-size: 13px; margin-top: 6px; }
header .back { margin-top: 14px; }
header .back a {
  color: var(--accent); text-decoration: none;
  border: 1px solid var(--line); padding: 5px 14px; border-radius: 3px;
  font-size: 12px; margin: 0 4px;
}

.scene-list { display: flex; flex-direction: column; gap: 28px; }

.scene-card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; overflow: hidden;
  display: grid; grid-template-columns: 1fr 1fr;
  min-height: 280px;
}
@media (max-width: 700px) { .scene-card { grid-template-columns: 1fr; } }

.scene-visual {
  background: var(--bg2);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; min-height: 260px;
}
.scene-visual svg { width: 100%; height: auto; max-height: 260px; }

.scene-info {
  padding: 22px 24px;
  display: flex; flex-direction: column;
  justify-content: center;
}
.scene-info .hour-tag {
  display: inline-block; font-size: 11px; padding: 2px 10px;
  border: 1px solid var(--accent); color: var(--accent);
  border-radius: 2px; letter-spacing: 2px; margin-bottom: 10px;
  width: fit-content;
}
.scene-info h3 { font-size: 18px; color: var(--gold); margin-bottom: 6px; }
.scene-info .place { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.scene-info .desc { font-size: 12px; line-height: 1.8; color: var(--text); }
.scene-info .meta { font-size: 11px; color: var(--muted); margin-top: 10px; }
</style>
</head>

function svgScene(theme, title, subtitle, elements) {
  const isDark = theme === 'dark';
  const bg = isDark ? '#1d1712' : '#2b2219';
  const textColor = '#9a8a72';

  let svg = `<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
    <rect width="320" height="200" fill="${bg}" rx="4"/>
    <text x="160" y="190" text-anchor="middle" fill="${textColor}" font-size="10" font-family="inherit">${escapeXml(title)}</text>
    <text x="160" y="202" text-anchor="middle" fill="${textColor}" font-size="8" font-family="inherit" opacity="0.6">${escapeXml(subtitle)}</text>`;

  const uniqueElements = deduplicateElements(elements);
  uniqueElements.forEach(el => {
    if (el.type === 'bar') {
      svg += `<rect x="${el.x}" y="${el.y}" width="${el.w || 3}" height="${el.h || 100}" fill="${el.color}" opacity="${el.opacity || 1}" rx="1"/>`;
    } else if (el.type === 'circle') {
      const glow = el.glow ? `filter="url(#glow)"` : '';
      svg += `<circle cx="${el.cx}" cy="${el.cy}" r="${el.r}" fill="${el.color}" opacity="${el.opacity || 1}" ${glow}/>`;
    } else if (el.type === 'rect') {
      svg += `<rect x="${el.x}" y="${el.y}" width="${el.w}" height="${el.h}" fill="${el.color}" opacity="${el.opacity || 1}" rx="${el.rx || 0}"/>`;
    } else if (el.type === 'polygon') {
      svg += `<polygon points="${el.points}" fill="${el.color}" opacity="${el.opacity || 1}"/>`;
    } else if (el.type === 'path') {
      svg += `<path d="${el.d}" fill="${el.fill}" stroke="${el.stroke || 'none'}" opacity="${el.opacity || 1}"/>`;
    } else if (el.type === 'person') {
      // Simplified person silhouette
      svg += `<ellipse cx="${el.x}" cy="${el.y - 22}" rx="6" ry="8" fill="${el.color}" opacity="${el.opacity || 1}"/>
        <path d="M ${el.x - 8},${el.y - 12} Q ${el.x},${el.y - 6} ${el.x + 8},${el.y - 12} L ${el.x + 10},${el.y} L ${el.x - 10},${el.y} Z" fill="${el.color}" opacity="${el.opacity || 1}"/>`;
    }
  });

  svg += `</svg>`;
  return svg;
}

function deduplicateElements(elements) {
  // Some elements may be generated dynamically (e.g. loops) — flatten them
  const result = [];
  elements.forEach(el => {
    if (Array.isArray(el)) {
      result.push(...el);
    } else {
      result.push(el);
    }
  });
  return result;
}

function escapeXml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

    e_hero: '你以身许国，孤身闯入龙潭。长安的灯依然亮着，只是少了一个曾经守护它的人。',
    e_people: '你赢得了所有人的信任。同路人齐聚灯楼，众志成城，长安因此得救。',
    e_alone: '你没有得到足够的支持。最终你独自担下一切，死而无憾，却也知道自己还活着——为了什么。',
    e_darkness: '灯楼上的选择，走向了不可回头的深渊。长安的夜，比任何人的死都更长。',
    h_zi2_gela: '子时 · 葛老的暗室。你坐下来和这位平康坊的主人聊起了长安的规矩——他的规矩。',
    h_mao_snack: '卯时 · 胡饼摊。烟火气里，张小敬掏钱买两个饼，和摊主闲聊两句。长安的味道还在。',
    h_wei_roof: '未时 · 望楼之上。风很大，视野开阔。你站在长安城最高的地方，俯瞰这座城。',
    h_you_xubin: '酉时 · 靖安司案牍库。徐宾抱着一摞卷轴过来，想跟你聊聊大案牍术的最新发现。',
  };
  return descriptions[sceneId] || '长安十二时辰中的一个瞬间。';
}

// Deduplicate scenes by hour/place
const seenScenes = new Set();
const sceneEntries = Object.entries(scenes).filter(([id, sc]) => {
  if (!sc || sc.ending === undefined) return true;
  if (sc.ending || sc.choices || isPassage(sc) || sc.text) {
    const key = sc.hour + '|' + sc.place;
    if (seenScenes.has(key) && !sc.ending) return false;
    seenScenes.add(key);
    return true;
  }
  return false;
});

const list = document.getElementById('sceneList');

// Sort by hour
const hourOrder = hours.map(h => h.key);
sceneEntries.sort((a, b) => {
  const ia = hourOrder.indexOf(a[1].hour);
  const ib = hourOrder.indexOf(b[1].hour);
  if (ia !== ib) return ia - ib;
  return 0;
});

sceneEntries.forEach(([id, sc]) => {
  if (!sc.choices && !sc.ending && !isPassage(sc) && !sc.text && sc.hour) {
    return; // Skip route-only nodes
  }
  const hour = hourMap[sc.hour];
  const visualFn = sceneVisuals[id] || sceneVisuals[sc.hour ? 'start' : 'e_hero'] || (() => svgScene('dark', sc.place || id, '', []));
  const visual = visualFn();
  const desc = getSceneDescription(id);

  const card = document.createElement('div');
  card.className = 'scene-card';
  card.innerHTML = `
    <div class="scene-visual">${visual}</div>
    <div class="scene-info">
      <div class="hour-tag">${hour ? hour.name + ' · ' + hour.label : ''}</div>
      <h3>${esc(sc.place || '—')}</h3>
      <div class="place">${sc.ending ? '【结局】' : isPassage(sc) ? '【过场】' : sc.choices ? '【抉择点】' : ''} ${id}</div>
      <div class="desc">${esc(desc)}</div>
      <div class="meta">${sc.choices ? sc.choices.length + ' 个选项' : ''} ${sc.hour ? '' : ''}</div>
    </div>`;
  list.appendChild(card);
});

function esc(s) { return String(s) ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }
</script>

</html>
