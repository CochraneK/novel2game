<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>一叠钱</title>
<meta name="description" content="一九五一年冬。一张纸，一叠钱，一个必须做出的决定。文字叙事游戏，改编自公众号「陈穆行纪」《一叠钱》。">
<style>
  /* ============================================================
     一叠钱 · 文字叙事游戏
     视觉基调：一九五一年深夜，一盏积灰的旧灯，一张纸，一支笔。
     深色暖调 + 宋体衬线 + 极慢的灯光呼吸。心志越高，灯越亮。
     自包含单文件，零外部依赖，离线可开。
     ============================================================ */

  :root {
    --bg:        #0b0906;
    --bg-2:      #100d08;
    --ink:       #e7d9bf;
    --ink-dim:   #b7a88c;
    --ink-faint: #71644f;
    --amber:     #cf9b4d;
    --amber-2:   #a8793a;
    --amber-3:   #6e5326;
    --rule:      rgba(207,155,77,0.22);
    --card:      rgba(255, 236, 200, 0.028);
    --lamp:      0.7;   /* 0..1 由心志驱动 */
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    -webkit-tap-highlight-color: transparent;
    background: var(--bg);
    color: var(--ink);
    font-family: "Songti SC", "STSong", "SimSun", "NSimSun",
                 "Noto Serif CJK SC", "Source Han Serif SC",
                 "Noto Serif SC", Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  /* ---- 灯光（两层：大范围暖晕 + 灯芯高光）---- */
  .lamp, .lamp-core {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .lamp {
    background: radial-gradient(ellipse 72% 60% at 50% 34%,
      rgba(222,168,94, calc(0.17 * var(--lamp))) 0%,
      rgba(158,106,46, calc(0.06 * var(--lamp))) 42%,
      rgba(11,9,6,0) 74%);
    animation: breathe 7s ease-in-out infinite;
  }
  .lamp-core {
    background: radial-gradient(circle 190px at 50% 27%,
      rgba(255,216,150, calc(0.11 * var(--lamp))) 0%,
      transparent 68%);
    animation: breathe 7s ease-in-out infinite;
    animation-delay: -3.5s;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.82; }
    50%      { opacity: 1; }
  }

  /* 极淡的纸纹颗粒，增加年代感 */
  .grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.05;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.04) 0 1px, transparent 1px 4px);
    mix-blend-mode: overlay;
  }

  /* ---- 主舞台 ---- */
  .stage {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    padding: 72px 22px 96px;
  }
  .column {
    width: 100%;
    max-width: 620px;
    margin: auto;   /* 短内容垂直居中，长内容移动端不裁切顶部 */
    opacity: 1;
    transition: opacity 0.42s ease;
  }
  .column.fade { opacity: 0; }

  /* ---- 章节标记 ---- */
  .marker {
    text-align: center;
    color: var(--amber-2);
    letter-spacing: 0.5em;
    font-size: 0.9rem;
    margin-bottom: 4px;
    text-indent: 0.5em;
  }
  .marker .num { color: var(--amber); }
  .rule {
    height: 1px;
    width: 56px;
    margin: 14px auto 34px;
    background: linear-gradient(90deg, transparent, var(--amber-3), transparent);
  }

  /* ---- 正文 ---- */
  .scene-text p {
    margin: 0 0 1.15em;
    font-size: 1.04rem;
    line-height: 2.12;
    letter-spacing: 0.02em;
    color: var(--ink);
    text-align: justify;
  }
  .scene-text p:last-child { margin-bottom: 0; }
  .scene-text .dim  { color: var(--ink-dim); }
  .scene-text .key  { color: var(--ink); font-weight: 600; }
  .scene-text .say  { color: var(--ink-dim); }

  /* ---- 抉择 ---- */
  .choices {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .choice {
    display: flex;
    align-items: baseline;
    gap: 14px;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-left: 2px solid var(--amber-3);
    padding: 15px 18px 15px 18px;
    color: var(--ink-dim);
    font-family: inherit;
    font-size: 1rem;
    line-height: 1.8;
    letter-spacing: 0.02em;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    transition: all 0.32s ease;
    border-radius: 0 2px 2px 0;
  }
  .choice .idx {
    color: var(--amber-3);
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    flex: none;
    width: 1.1em;
    transition: color 0.32s ease;
  }
  .choice .txt { flex: 1; }
  .choice:hover, .choice:focus {
    outline: none;
    border-left-color: var(--amber);
    color: var(--ink);
    background: linear-gradient(90deg, rgba(207,155,77,0.07), transparent 70%);
    transform: translateX(6px);
  }
  .choice:hover .idx, .choice:focus .idx { color: var(--amber); }

  /* 单一"继续"式选择，弱化呈现 */
  .choice.solo { justify-content: center; border-left-color: transparent; }
  .choice.solo .idx { display: none; }
  .choice.solo:hover { transform: none; background: none; }
  .choice.solo .txt {
    letter-spacing: 0.35em;
    text-indent: 0.35em;
    color: var(--amber-2);
    font-size: 0.95rem;
  }
  .choice.solo:hover .txt { color: var(--amber); }

  /* ---- 历史档案卡（终章揭示）---- */
  .archive {
    margin-top: 46px;
    padding: 30px 26px 26px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 3px;
    position: relative;
  }
  .archive::before {
    content: "史 料";
    position: absolute;
    top: -0.62em;
    left: 24px;
    background: var(--bg);
    padding: 0 12px;
    color: var(--amber-2);
    font-size: 0.78rem;
    letter-spacing: 0.5em;
  }
  .archive p {
    margin: 0 0 1em;
    font-size: 0.96rem;
    line-height: 2.05;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
    text-align: justify;
  }
  .archive p:last-child { margin-bottom: 0; }
  .archive .name { color: var(--ink); font-weight: 600; }
  .archive .date { color: var(--amber); }
  .archive .final {
    color: var(--ink);
    font-size: 1.02rem;
    line-height: 2.15;
    margin-top: 1.4em;
  }
  .archive .final .quote {
    color: var(--amber);
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  /* ---- 结局标题 ---- */
  .ending-title {
    text-align: center;
    color: var(--amber);
    font-size: 1.5rem;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    margin: 6px 0 4px;
    font-weight: 500;
  }
  .ending-sub {
    text-align: center;
    color: var(--ink-faint);
    font-size: 0.85rem;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    margin-bottom: 34px;
  }

  /* ---- 重新开始 ---- */
  .restart {
    margin-top: 44px;
    text-align: center;
  }
  .restart button {
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink-dim);
    font-family: inherit;
    font-size: 0.9rem;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    padding: 12px 34px;
    cursor: pointer;
    touch-action: manipulation;
    border-radius: 2px;
    transition: all 0.35s ease;
  }
  .restart button:hover {
    color: var(--amber);
    border-color: var(--amber-2);
    background: rgba(207,155,77,0.05);
  }

  /* ---- 页脚署名 ---- */
  .footer {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 3;
    text-align: center;
    padding: 16px 18px 20px;
    font-size: 0.76rem;
    letter-spacing: 0.12em;
    color: var(--ink-faint);
    pointer-events: none;
  }
  .footer .sep { margin: 0 10px; opacity: 0.5; }

  /* ---- 角落重开 ---- */
  .corner-restart {
    position: fixed;
    top: 18px; right: 20px;
    z-index: 4;
    background: none;
    border: none;
    color: var(--ink-faint);
    font-family: inherit;
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    cursor: pointer;
    touch-action: manipulation;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease, color 0.3s ease;
  }
  .corner-restart.show { opacity: 1; pointer-events: auto; }
  .corner-restart:hover { color: var(--amber); }

  /* ---- 心志 gauge（左缘竖条，桌面端显示；移动端由灯光代替反馈）---- */
  .gauge {
    position: fixed;
    left: 22px; top: 50%;
    transform: translateY(-50%);
    z-index: 4;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  @media (min-width: 720px) { .gauge { display: flex; } }
  .gauge.show { opacity: 1; }
  .gauge .word {
    writing-mode: vertical-rl;
    color: var(--ink-faint);
    font-size: 0.72rem;
    letter-spacing: 0.4em;
    transition: color 0.6s ease;
  }
  .gauge.show .word { color: var(--amber-2); }
  .gauge .track {
    width: 2px;
    height: 84px;
    background: rgba(207,155,77,0.14);
    border-radius: 1px;
    position: relative;
    overflow: hidden;
  }
  .gauge .fill {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 40%;
    background: linear-gradient(180deg, var(--amber), var(--amber-3));
    transition: height 0.8s ease;
    border-radius: 1px;
  }

  /* ---- 结局图鉴（开场屏底部）---- */
  .codex {
    margin-top: 42px;
    padding-top: 26px;
    border-top: 1px solid var(--rule);
    text-align: center;
  }
  .codex .label {
    color: var(--ink-faint);
    font-size: 0.74rem;
    letter-spacing: 0.5em;
    text-indent: 0.5em;
    margin-bottom: 16px;
  }
  .codex .row {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .codex .cell {
    padding: 7px 16px;
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-size: 0.8rem;
    letter-spacing: 0.14em;
    color: var(--ink-faint);
  }
  .codex .cell.lit {
    color: var(--amber);
    border-color: var(--amber-3);
    background: rgba(207,155,77,0.05);
  }
  .codex .hint {
    margin-top: 14px;
    color: var(--ink-faint);
    font-size: 0.72rem;
    letter-spacing: 0.2em;
  }

  /* ---- 首次解锁提示 ---- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 64px;
    transform: translateX(-50%) translateY(12px);
    z-index: 6;
    background: rgba(16,13,8,0.92);
    border: 1px solid var(--rule);
    color: var(--ink-dim);
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    padding: 10px 22px;
    border-radius: 2px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease, transform 0.5s ease;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast b { color: var(--amber); font-weight: 600; margin: 0 6px; }

  /* ---- 移动端 ---- */
  @media (max-width: 520px) {
    .stage { padding: calc(56px + env(safe-area-inset-top)) 18px calc(84px + env(safe-area-inset-bottom)); }
    .scene-text p { font-size: 1rem; line-height: 1.95; }
    .marker { letter-spacing: 0.35em; }
    .choices { margin-top: 32px; gap: 10px; }
    .choice { padding: 16px 14px; font-size: 0.98rem; }
    .archive { margin-top: 36px; padding: 24px 18px 20px; }
    .ending-title { font-size: 1.3rem; }
    .restart { margin-top: 36px; }
    .restart button { padding: 13px 28px; }
    .footer { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
    .toast { bottom: calc(56px + env(safe-area-inset-bottom)); font-size: 0.74rem; letter-spacing: 0.1em; }
  }
</style>
</head>
<body>
  <div class="lamp"></div>
  <div class="lamp-core"></div>
  <div class="grain"></div>

  <button class="corner-restart" id="cornerRestart" title="从头开始">重 新 开 始</button>

  <div class="gauge" id="gauge" aria-hidden="true">
    <span class="word" id="gaugeWord">平稳</span>
    <span class="track"><span class="fill" id="gaugeFill"></span></span>
  </div>

  <div class="toast" id="toast"></div>

  <main class="stage">
    <div class="column" id="column"></div>
  </main>

  <footer class="footer">
    改编自公众号「陈穆行纪」《一叠钱》
    <span class="sep">·</span>
    刘青山、张子善案
    <span class="sep">·</span>
    一九五一年
  </footer>

<script>
/* ================================================================
   一叠钱 · 叙事引擎
   场景图：intro → 一灯下 → … → 四落笔(关键分岔) → 多结局
   隐藏"心志"值：选择累计，驱动灯光明暗与落笔结局的三种尾声。
   ================================================================ */

// ---- 共享：历史档案（所有结局的终章揭示）----
const HISTORICAL = [
  { t: '他叫 <span class="name">李克才</span>。' },
  { t: '那个曾经和他并肩作战、后来成为他不得不反映问题的同志，叫 <span class="name">刘青山</span>。另一个名字，叫 <span class="name">张子善</span>。' },
  { t: '公开史料记载，李克才曾多次抵制刘青山、张子善的不当做法，包括反对挪用地方粮、河工粮，也拒绝接受张子善送钱。一九五一年，他又多次向上级反映有关问题。同年十一月二十一日，在河北省第三次党代会上，他进一步公开揭发刘青山、张子善的问题。此后，河北省委派出人员进行调查，案件逐渐从个人之间的争执，变成了组织必须面对的问题。' },
  { t: '<span class="date">一九五二年二月十日</span>，刘青山、张子善在保定被执行死刑。刘青山终年三十六岁。张子善终年三十八岁。' },
  { t: '李克才后来也没有成为一个生活在历史聚光灯下的人。事情结束以后，时间继续向前。新的工作，新的生活，新的国家，新的问题。那些曾经改变过历史的人，也重新变成普通人。' },
  { t: '<span class="date">二〇〇一年六月三十日</span>，李克才在天津胸科医院病逝，享年八十四岁。距离一九五一年，已经过去了半个世纪。' },
  { class: 'final', html: '可是有些事情不会因此消失。因为真正重要的，从来不是一个人的名字有多少人记得，而是——当历史重新把同样的问题摆到桌子上的时候，还有没有人能够站出来，讲一句：<br><span class="quote">不能这么做。</span>' }
];

// ---- 场景数据 ----
const SCENES = {

  /* ============ 开场 ============ */
  intro: {
    marker: null,
    title: true,
    render: (state) => `
      <div class="marker" style="margin-bottom:10px;">一九五一年 · 冬前</div>
      <div class="rule"></div>
      <div class="ending-title" style="margin:10px 0 6px;">一 叠 钱</div>
      <div class="ending-sub" style="margin-bottom:44px;">文字叙事游戏</div>
      <div class="scene-text">
        <p class="dim">那天晚上，他没有立即回家。</p>
        <p>桌上只有一盏灯。灯罩已经旧了，积着一层灰，光从尘土之间透出来，黄黄的。</p>
        <p>他坐在那里，看着面前的那张纸。纸上有一串数字。</p>
        <p class="dim">仗打完以后，枪声消失得很快，人的脚步声却越来越多。机关多了，办公室多了，文件多了，印章多了，会议也多了。</p>
        <p>从前大家盼着天下太平。如今天下真的太平了一些，他却忽然发现——<span class="key">太平也有太平的麻烦。</span></p>
        <p>打仗的时候，敌人穿着另一种衣服。现在呢？现在敌人有时候，穿着和自己一样的衣服。</p>
      </div>
      <div class="choices">
        <button class="choice solo" data-next="s_lamp"><span class="txt">落 座</span></button>
      </div>
      ${codexHTML()}`
  },

  /* ============ 一 · 灯下 ============ */
  s_lamp: {
    marker: '一',
    markerLabel: '灯 下',
    text: [
      '他把那张纸拿起来。那是一笔钱。',
      '钱从哪里来，他知道。要拿去做什么，他也知道。',
      '真正让他难受的，只剩下一个问题：',
      '<span class="key">这笔钱，究竟是谁的钱？</span>',
      '其实这并不是一个复杂的问题。人世间真正让人痛苦的事情，往往都不是因为问题复杂，而是因为答案太简单。',
      '他甚至不愿意把它想得太明白。因为一旦想明白，就必须做事情。而做事情，就意味着得罪一个自己曾经十分尊敬的人。',
      '桌上那一叠钱，他没有去碰。可他知道，真正压在桌上的，从来不只是钱。'
    ],
    choices: [
      { text: '拿起那张纸，看清那一串数字', next: 's_face', stance: 1 },
      { text: '把纸翻过去，扣在桌上', next: 's_avoid', stance: -1 }
    ]
  },

  /* ============ 过渡：看清 ============ */
  s_face: {
    marker: null,
    text: [
      '数字没有变。还是那一串。',
      '他知道这意味着什么。那笔钱，不是机关的钱，不是工程的钱，也不是粮食的钱。',
      '可他仍然愿意再给自己一次机会——也许，是有人弄错了账目。至少，他愿意当面问清楚。',
      '窗外，城市已经安静下来。他站起来，披上外套。'
    ],
    choices: [
      { text: '第二天，去见那个人', next: 's_meeting' },
      { text: '再等一等，也许是自己看错了', next: 's_wait', stance: -1 }
    ]
  },

  /* ============ 过渡：扣住 ============ */
  s_avoid: {
    marker: null,
    text: [
      '他把纸翻了过去，扣在桌上。',
      '灯还亮着。数字被压在纸的背面，可他觉得它们还在那里，透过纸张，一点一点地渗出来。',
      '他回到家，坐在床沿上，没有开灯。黑暗里，那串数字比灯下更清楚。',
      '他知道，逃避不会让数字变小。它们只会在夜里，越长越大。'
    ],
    choices: [
      { text: '还是去见他', next: 's_meeting', stance: 1 },
      { text: '把那张纸，锁进抽屉', next: 'end_silence_early', stance: -2 }
    ]
  },

  /* ============ 过渡：再看 ============ */
  s_wait: {
    marker: null,
    text: [
      '他又看了一遍。一遍，又一遍。',
      '数字依旧是数字，纸依旧是纸。没有看错。',
      '窗外的城市安静下来。他忽然觉得，等待本身，就是一种回答。',
      '他拖得越久，那个答案就越清楚——他知道，他什么都知道。'
    ],
    choices: [
      { text: '去见他', next: 's_meeting' },
      { text: '把那张纸，锁进抽屉', next: 'end_silence_early', stance: -2 }
    ]
  },

  /* ============ 二 · 会面 ============ */
  s_meeting: {
    marker: '二',
    markerLabel: '会 面',
    text: [

        <p>后来，案件还是发生了。刘青山、张子善，一九五二年二月十日。</p>
        <p>李克才手里那张一半是字、一半是涂痕的纸，被夹进了某个抽屉，再也没有拿出来。</p>
        <p>二〇〇一年六月三十日，他在天津病逝，享年八十四岁。</p>
        <p>整理遗物的时候，有人在抽屉里发现了那张纸。</p>
        <p>一半是字，一半是涂痕。</p>
        <p>没有人把它销毁，也没有人把它交出去。它只是被放在那里。像一个没有做完的梦。也像一道，<span class="key">到死都没有落下的笔。</span></p>
      </div>
      ${archiveHTML()}
      <div class="restart"><button data-action="restart">重 新 开 始</button></div>`
  }
};

// ---- 落笔结局：心志三档尾声 ----
function writingEpilogue(stance) {
  if (stance >= 7) {
    return [
      '他落笔的那一夜，没有成为任何人的英雄。',
      '历史没有要求每一个人都成为伟大的人。很多时候，它只要求一个人在一个极小的时刻，不要做一个懦弱的人。',
      '而所谓勇敢，也不是心里没有恐惧。恰恰相反——<span class="key">勇敢是，恐惧已经把你所有的退路都告诉你了，而你仍然没有选择那条退路。</span>'
    ];
  }
  if (stance >= 3) {
    return [
      '他落笔了。',
      '手，也许有一点抖。笔尖离开纸面、又落下的那一瞬，他听见了自己的心跳。',
      '但那一行字，到底还是落在了纸上。很慢。很重。没有一句骂人的话，只写着事实。',
      '<span class="key">从这一笔开始，这已经不再只是两个人之间的事情了。</span>'
    ];
  }
  return [
    '他落笔了。',
    '只是直到很后来，他仍说不清，自己那一刻究竟是勇敢，还是在害怕。也许，两者都是。',
    '他把那张纸交出去以后，夜里常常醒来，一遍一遍地问自己：如果我错了呢？',
    '这个问题，他始终没有等到答案。可他知道，自己再也不能<span class="key">明知不对，还继续沉默</span>了。'
  ];
}

// ---- 历史档案卡 HTML ----
function archiveHTML() {
  const body = HISTORICAL.map(item =>
    item.class
      ? `<p class="final">${item.html}</p>`
      : `<p>${item.t}</p>`
  ).join('');
  return `<div class="archive">${body}</div>`;
}

/* ================================================================
   运行时
   ================================================================ */
const column = document.getElementById('column');
const corner = document.getElementById('cornerRestart');

const state = { stance: 0, scene: 'intro' };

function lampFor(stance) {
  // 心志约在 -7..10 之间 → 映射到灯光 0.3..1
  const t = Math.max(0, Math.min(1, (stance + 7) / 17));
  return (0.3 + t * 0.7).toFixed(2);
}
function applyLamp() {
  document.documentElement.style.setProperty('--lamp', lampFor(state.stance));
}

/* ---- 结局图鉴：localStorage 记录已解锁结局（仅本机） ---- */
const ENDINGS = {
  end_writing: '落笔',
  end_silence_early: '沉默',
  end_silence_late: '未落之笔',
  end_crossing: '涂痕'
};
const LS_KEY = 'yidieqian_endings';
function loadUnlocked() {
  try {
    const v = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
}
function unlockEnding(id) {
  if (!ENDINGS[id]) return false;
  const list = loadUnlocked();
  if (list.includes(id)) return false;
  list.push(id);
  try { localStorage.setItem(LS_KEY, JSON.stringify(list)); } catch (e) {}
  return true;
}
function codexHTML() {
  const unlocked = loadUnlocked();
  const cells = Object.keys(ENDINGS).map(id =>
    unlocked.includes(id)
      ? `<span class="cell lit">${ENDINGS[id]}</span>`
      : `<span class="cell">？？？</span>`
  ).join('');
  const n = unlocked.length;
  const hint = n === 0 ? '四条路，只有一条落笔。'
    : (n === 4 ? '四条路，都走过了。' : '已走过 ' + n + ' / 4 条');
  return `
    <div class="codex">
      <div class="label">结 局</div>
      <div class="row">${cells}</div>
      <div class="hint">${hint}</div>
    </div>`;
}

/* ---- 心志 gauge（显性提示）+ 首次解锁 toast ---- */
const gaugeEl = document.getElementById('gauge');
const gaugeWord = document.getElementById('gaugeWord');
const gaugeFill = document.getElementById('gaugeFill');
function stanceWord(stance) {
  if (stance <= -3) return '动摇';
  if (stance <= -1) return '犹疑';
  if (stance <= 2)  return '平稳';
  if (stance <= 6)  return '坚定';
  return '笃定';
}
function updateGauge() {
  const t = Math.max(0, Math.min(1, (state.stance + 4) / 12));
  gaugeFill.style.height = (12 + t * 88).toFixed(0) + '%';
  gaugeWord.textContent = stanceWord(state.stance);
  gaugeEl.classList.toggle('show', state.scene !== 'intro');
}
const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(html) {
  toastEl.innerHTML = html;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3600);
}

function sceneHTML(id) {
  const sc = SCENES[id];
  if (!sc) return '';
  if (sc.render) return sc.render(state);

  let html = '';
  if (sc.marker) {
    const label = sc.markerLabel ? ` · ${sc.markerLabel}` : '';
    html += `<div class="marker"><span class="num">${sc.marker}</span>${label}</div><div class="rule"></div>`;
  }
  html += `<div class="scene-text">` + sc.text.map(p => `<p>${p}</p>`).join('') + `</div>`;
  html += `<div class="choices">`;
  sc.choices.forEach((c, i) => {
    const idx = String(i + 1);
    html += `<button class="choice${c.solo ? ' solo' : ''}" data-next="${c.next}" data-stance="${c.stance || 0}">
      <span class="idx">${idx}</span><span class="txt">${c.text}</span></button>`;
  });
  html += `</div>`;
  return html;
}

let animating = false;
function go(id) {
  state.scene = id;
  if (animating) return;
  animating = true;
  column.classList.add('fade');
  setTimeout(() => {
    column.innerHTML = sceneHTML(id);
    applyLamp();
    updateGauge();
    window.scrollTo(0, 0);
    column.classList.remove('fade');
    corner.classList.toggle('show', id !== 'intro');
    if (ENDINGS[id] && unlockEnding(id)) {
      toast('新结局已记录 <b>' + ENDINGS[id] + '</b> · ' + loadUnlocked().length + ' / 4');
    }
    // 聚焦第一个选择，便于键盘操作
    setTimeout(() => {
      const first = column.querySelector('button.choice, button[data-action]');
      if (first) first.focus({ preventScroll: true });
      animating = false;
    }, 60);
  }, 430);
}

// 事件委托：选择 / 重新开始
column.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  if (btn.dataset.action === 'restart') { reset(); return; }
  if (btn.dataset.next) {
    state.stance += parseInt(btn.dataset.stance || '0', 10);
    go(btn.dataset.next);
  }
});
corner.addEventListener('click', reset);

function reset() {
  state.stance = 0;
  go('intro');
}

// 键盘：数字键选择，Enter/Space 推进单选
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    const solo = column.querySelector('button.choice.solo');
    if (solo && document.activeElement !== column.querySelector('button')) {
      e.preventDefault(); solo.click();
    }
  }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9) {
    const btns = column.querySelectorAll('button.choice');
    if (btns[n - 1]) { e.preventDefault(); btns[n - 1].click(); }
  }
});

// 启动
column.innerHTML = sceneHTML('intro');
applyLamp();
updateGauge();
</script>
</body>
</html>
